<!doctype html>
<meta charset="utf-8">
<title>Page not found</title>
<script>
  // A link from before the docs were versioned (e.g. .../api.html): retry it in stable/.
  const root = new URL("https://jmineau.github.io/slv/").pathname;
  const rest = location.pathname.startsWith(root) ? location.pathname.slice(root.length) : "";
  if (rest && !["dev", "stable", "2026.10.0", "2026.9.1"].includes(rest.split("/")[0])) {
    location.replace(root + "stable/" + rest + location.search + location.hash);
  }
</script>
<p>Page not found. <a href="https://jmineau.github.io/slv/">Go to the documentation</a>.</p>
