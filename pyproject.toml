[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "slv"
dynamic = ["version"]  # from git tags, via setuptools-scm
description = "Salt Lake Valley python modules"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "James Mineau", email = "James.Mineau@utah.edu"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "cartopy",
    "geopandas",
    "lair[science,geo] @ git+https://github.com/jmineau/lair@v2026.12.8",  # geo: lair.geo (rasterio/rioxarray/shapely)
    "matplotlib",
    "pandas",
    "siphon>=0.10.0",
    "uataq @ git+https://github.com/jmineau/uataq@v2026.10.0",
    "xarray",
]

[project.optional-dependencies]
inversion = [
    "fips[flux]>=0.1.0b8",
    "pystilt>=0.1.0a24",  # Project.jacobian, one footprint per thread; the shared output layout
    "joblib>=1.5.3",
    "seaborn",
    # "xesmf",
]

[dependency-groups]
# Dev tooling and docs together; `uv sync` installs it by default.
dev = [
    "slv[inversion]",
    "docstr-coverage>=2.3",
    "git-cliff>=2.10",  # `just changelog`
    "ipykernel>=7.2.0",
    "pre-commit>=4.0",
    "pydata-sphinx-theme>=0.16",
    "pyrefly>=1.3",
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16",
    "rust-just>=1.40",
    "setuptools-scm>=8",  # `just version`
    "sphinx>=8.1",
    "sphinx-autobuild>=2024.10",  # `just docs-serve`
    "sphinx-autodoc-typehints>=3.0",
    "sphinx-copybutton>=0.5",
    "twine>=6.0",  # `just dist`
]

[project.urls]
Homepage = "https://github.com/jmineau/slv"
Documentation = "https://jmineau.github.io/slv/"
Repository = "https://github.com/jmineau/slv"
Issues = "https://github.com/jmineau/slv/issues"
Changelog = "https://github.com/jmineau/slv/blob/main/CHANGELOG.md"

[tool.coverage.run]
source = ["slv"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "def __repr__",
]

[tool.pyrefly]
project-includes = ["src"]
python-version = "3.11"  # as CI checks, against the oldest supported Python
ignore-missing-imports = ["xesmf"]  # conda-forge only, imported lazily
# The errors that existed when slv moved from pyright to pyrefly (2026-10), nearly
# all from pandas-stubs. New errors fail the check; fix the listed ones over time,
# then run `uv run pyrefly check --update-baseline` to shrink it.
baseline = "pyrefly-baseline.json"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
strict = true  # strict markers, config, xfail and parametrize ids
addopts = ["-ra"]
log_level = "INFO"  # show captured logs for failing tests
# Warnings are errors, so deprecations surface early. Ignore a specific
# third-party warning with e.g. "ignore:some message:DeprecationWarning:pkg".
filterwarnings = [
    "error",
    # seaborn's boxplot passes matplotlib the old `vert` argument.
    "ignore:vert. bool:PendingDeprecationWarning:seaborn",
    "ignore:vert. bool:DeprecationWarning:seaborn",
    # xarray's netCDF4 backend sets an array's shape (deprecated in NumPy 2.5).
    "ignore:Setting the shape on a NumPy array:DeprecationWarning:xarray",
    # cartopy downloads Natural Earth and caches map tiles where none are cached.
    "ignore::cartopy.io.DownloadWarning",
    "ignore:Cartopy created the following directory to cache:UserWarning",
    # numpy ignores this one itself (compiled packages such as netCDF4 raise it on
    # import); pytest's "error" filter would bring it back.
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
markers = [
    "network: needs live network access; excluded from default runs",
    "slow: expensive in time, bandwidth or disk; excluded from default runs",
]

[tool.repo-review]
# Scientific Python repo-review (`uvx --from "sp-repo-review[cli]" sp-repo-review .`)
# checks that python-template skips on purpose:
ignore = [
    "PY007",  # task runner: just, not nox/tox
    "MY101",  # pyrefly's default preset; tighten per project
    "PC110", "PC190",  # ruff runs as a local `uv run` hook, so uv.lock pins its version
    "PC140",  # pyrefly runs as a local `uv run` hook, so it sees the project's dependencies
    "PC160",  # no spell checker
    "PC180",  # no markdown formatter
    "PC901", "PC902", "PC903",  # pre-commit.ci is not used
]

[tool.ruff]
# target-version comes from project.requires-python

[tool.ruff.format]
docstring-code-format = true
# ruff also formats code blocks in Markdown; these keep their examples as written
# (e.g. hand-aligned comments).
exclude = ["README.md", "AGENTS.md"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
    "D",  # pydocstyle, NumPy convention (below)
    "D213",  # docstring summary on the second line
    "NPY",  # NumPy-specific, incl. NumPy 2 deprecations
    "RUF100",  # unused noqa
]
ignore = [
    "E501",  # line too long, handled by formatter
    "D105",  # magic methods need no docstring (docstr-coverage skips them too)
    "D200",  # One-line docstring should fit on one line with quotes
    "D212",  # Multi-line docstring summary should start at the first line
    "D400",  # First line should end with a period, question mark, or exclamation point
    # slv's summaries say what a function returns as a noun phrase ("The directory a
    # package is imported from"), often over several lines (James, 2026-10-07).
    "D205",  # 1 blank line required between summary line and description
    "D401",  # First line of docstring should be in imperative mood
]

[tool.ruff.lint.per-file-ignores]
# Tests need no docstrings; the docstring format rules still apply to them.
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["slv"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"slv" = ["py.typed"]
"slv.emissions" = ["*.csv"]
"slv.measurements" = ["*.csv"]
"slv.measurements.mobile" = ["*.csv", "*.geojson"]

[tool.setuptools_scm]
# Releases are git tags vYYYY.M.PATCH (see CONTRIBUTING.md). Between releases
# the version is the next patch as a dev version, e.g. 2026.9.2.dev3+g1a2b3c4.
fallback_version = "0.0.0"  # no git metadata at all (e.g. a bare source copy)

[tool.uv]
required-version = ">=0.12"
# Rebuild the editable install when pyproject.toml or the git state changes, so
# `__version__` follows new commits and tags. This replaces uv's default keys, so
# add { file = "setup.py" } (and any C sources) if the project has them.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# The environment with xesmf, which needs ESMF from conda-forge. pixi installs the
# conda packages named here and everything else from the dependencies above.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"
# The no-MPI ESMF build: the MPICH build starts MPI on import, and when that
# start-up fails it kills the whole process group.
esmf = { version = "*", build = "nompi*" }
esmpy = ">=8.4"
xesmf = "*"

[tool.pixi.pypi-dependencies]
slv = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["inversion", "dev"], solve-group = "default" }
