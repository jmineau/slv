[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "slv"
dynamic = ["version"]  # from git tags, via setuptools-scm
description = "Salt Lake Valley python modules"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "James Mineau", email = "James.Mineau@utah.edu"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "cartopy",
    "geopandas",
    "lair[science,geo] @ git+https://github.com/jmineau/lair@v2026.12.7",  # geo: lair.geo (rasterio/rioxarray/shapely)
    "matplotlib",
    "pandas",
    "siphon>=0.10.0",
    "uataq @ git+https://github.com/jmineau/uataq",
    "xarray",
]

[project.optional-dependencies]
inversion = [
    "fips[flux]>=0.1.0b8",  # JacobianBuilder.build_from_target(variant=...)
    "pystilt>=0.1.0a21",  # variants: one footprint per simulation
    "joblib>=1.5.3",
    "seaborn",
    # "xesmf",
]

[dependency-groups]
dev = [
    "slv[inversion]",
    "docstr-coverage>=2.0.0",
    "ipykernel>=7.2.0",
    "pre-commit>=3.0.0",
    "pydata-sphinx-theme>=0.14.0",
    "pyright[nodejs]>=1.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "sphinx>=7.0.0",
    "sphinx-autodoc-typehints>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/jmineau/slv"
Documentation = "https://jmineau.github.io/slv/"
Repository = "https://github.com/jmineau/slv"
Issues = "https://github.com/jmineau/slv/issues"

[tool.coverage.run]
source = ["src/slv"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    ]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "**/.venv"]
venvPath = "."
venv = ".venv"
# pandas' partial annotations type most indexing as `DataFrame | Series` (and many
# returns as unions), so these rules flood with false positives on ordinary pandas
# code (~340 of them). They stay visible as warnings; every other rule -- unbound
# names, missing imports, None access, ... -- still fails the check.
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportIndexIssue = "warning"
reportCallIssue = "warning"
reportReturnType = "warning"
reportOperatorIssue = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # Pyflakes
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",  # isort
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["slv"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"slv" = ["py.typed"]
"slv.emissions" = ["*.csv"]
"slv.measurements" = ["*.csv"]
"slv.measurements.mobile" = ["*.csv", "*.geojson"]

[tool.setuptools_scm]
# Releases are git tags vYYYY.M.PATCH (see CONTRIBUTING.md). Between releases
# the version is the next patch as a dev version, e.g. 2026.9.2.dev3+g1a2b3c4.
fallback_version = "0.0.0"  # no git metadata at all (e.g. a bare source copy)

[tool.uv]
required-version = ">=0.12"
# Rebuild the editable install when pyproject.toml or the git state changes, so
# `__version__` follows new commits and tags.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
