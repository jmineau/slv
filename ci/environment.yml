name: slv

channels:
  - conda-forge
  - nodefaults

dependencies:
  # python version is injected from the workflow matrix: python=${{ matrix.python-version }}
  - python
  - esmpy>=8.4
  # The no-MPI ESMF build: the MPICH build starts MPI on import, and when that
  # start-up fails it kills the whole process group, so pytest died with exit
  # 143 (no traceback) at the first xesmf import in about half the CI runs
  - esmf=*=nompi*
  - xesmf

  # slv core deps available on conda-forge
  - cartopy
  - geopandas
  - matplotlib
  - pandas
  - siphon>=0.10.0
  - xarray
  # inversion extra (fips comes from pip below)
  - joblib>=1.5.3
  - seaborn

  # test / dev / docs / quality deps
  - pytest>=7.0.0
  - pytest-cov>=4.0.0
  - pydata-sphinx-theme>=0.14.0
  - sphinx>=7.0.0
  - sphinx-autodoc-typehints>=1.24.0
  - pyrefly>=1.3
  - ruff>=0.1.0

  - pip
  - pip:
      # not packaged on conda-forge
      - docstr-coverage>=2.0.0
      # git-only deps not on conda-forge
      - fips[flux] @ git+https://github.com/jmineau/fips
      # geo extra: lair.geo, imported by slv.inversion.config
      - lair[science,geo] @ git+https://github.com/jmineau/lair@v2026.12.7
      - uataq @ git+https://github.com/jmineau/uataq
