name: slv

# The conda environment slv needs for regridding: xesmf comes only from
# conda-forge. The Tests workflow's conda job runs the test suite in it; the
# other checks use uv.lock. Keep the pins in step with pyproject.toml.

channels:
  - conda-forge
  - nodefaults

dependencies:
  # python version is injected from the workflow: python=3.12
  - python
  - esmpy>=8.4
  # The no-MPI ESMF build: the MPICH build starts MPI on import, and when that
  # start-up fails it kills the whole process group, so pytest died with exit
  # 143 (no traceback) at the first xesmf import in about half the CI runs
  - esmf=*=nompi*
  - xesmf

  # slv core deps available on conda-forge
  - cartopy
  - geopandas
  - matplotlib
  - pandas
  - siphon>=0.10.0
  - xarray
  # inversion extra (fips and pystilt come from pip below)
  - joblib>=1.5.3
  - seaborn

  # tests
  - pytest>=9.0
  - pytest-xdist>=3.6

  - pip
  - pip:
      # inversion extra, from PyPI as in pyproject.toml
      - fips[flux]>=0.1.0b8
      - pystilt>=0.1.0a24
      # git-only deps not on conda-forge
      # geo extra: lair.geo, imported by slv.inversion.config
      - lair[science,geo] @ git+https://github.com/jmineau/lair@v2026.12.7
      - uataq @ git+https://github.com/jmineau/uataq
